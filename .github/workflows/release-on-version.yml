name: Release on version bump

# When a new version reaches main, create a GitHub Release and call Publish
# (workflow_call). Note: GITHUB_TOKEN-created releases do NOT trigger
# `on: release` in other workflows — so we invoke publish.yml directly.

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/ollama_advisor/__init__.py"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.exists == 'false' }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pyproject.toml
        id: ver
        run: |
          VERSION=$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Skip if tag already exists
        id: check
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG is new — will create release."
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          body: |
            Automated release for `ollama-advisor` **${{ steps.ver.outputs.version }}**.

            Install:
            ```bash
            pip install -U ollama-advisor==${{ steps.ver.outputs.version }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    if: needs.release.outputs.should_publish == 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit
