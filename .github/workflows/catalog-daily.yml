name: Daily Catalog Snapshot

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Fetch catalog and write CSV/JSON
        run: |
          ollama-advisor snapshot --output data/catalog --force-refresh

      - name: Show diff summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/catalog/latest_diff.json")
          if p.exists():
              d = json.loads(p.read_text())
              print(json.dumps(d, indent=2))
              print("added:", len(d.get("diff", {}).get("added", [])))
              print("removed:", len(d.get("diff", {}).get("removed", [])))
          PY

      - name: Commit and push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog
          if git diff --staged --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git commit -m "chore: update daily Ollama catalog snapshot"
          git push
